<svg viewBox="0 0 500 500" width="500" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E29C" />
      <stop offset="35%" stop-color="#E5A638" />
      <stop offset="70%" stop-color="#B3781A" />
      <stop offset="100%" stop-color="#F3D17A" />
    </linearGradient>

    <linearGradient id="gSilver" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#718096" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="gRoad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24" />
      <stop offset="50%" stop-color="#0E1015" />
      <stop offset="100%" stop-color="#252A35" />
    </linearGradient>

    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="500" height="500" fill="#000000" rx="40" />

  <!-- Hexagon Road Emblem -->
  <g transform="translate(130, 40) scale(2)">
    <!-- Top Gold Arm -->
    <path d="M 60,8 L 102,32 L 88,40 L 60,24 L 32,40 L 46,48 L 60,40 L 88,56 L 68,68 L 50,58 L 22,74 L 18,72 L 18,32 Z" fill="url(#gGold)" />
    <path d="M 60,8 L 102,32 L 95,36 L 60,16 L 25,36 L 18,32 Z" fill="#FFF5C2" opacity="0.8" />

    <!-- Bottom Silver Arm -->
    <path d="M 60,112 L 18,88 L 32,80 L 60,96 L 88,80 L 74,72 L 60,80 L 32,64 L 52,52 L 70,62 L 98,46 L 102,48 L 102,88 Z" fill="url(#gSilver)" />
    <path d="M 60,112 L 18,88 L 25,84 L 60,104 L 95,84 L 102,88 Z" fill="#FFFFFF" opacity="0.9" />

    <!-- Road Ribbon -->
    <path d="M 32,96 C 52,78 68,64 74,48 L 88,40 C 80,62 60,84 42,106 Z" fill="url(#gRoad)" stroke="#1E293B" stroke-width="1.5" />
    <path d="M 36,98 C 54,80 70,64 76,46" stroke="#F59E0B" stroke-width="3.5" stroke-dasharray="6 5" fill="none" stroke-linecap="round" filter="url(#fGlow)" />
  </g>

  <!-- SECURE HAUL Typography -->
  <text x="145" y="360" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="4">SECURE</text>
  <text x="350" y="360" fill="#E5A638" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="4">HAUL</text>

  <!-- Tagline -->
  <text x="250" y="405" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">SMART LOADS. <tspan fill="#E5A638">SECURE CONNECTIONS.</tspan> LIMITLESS POSSIBILITIES.</text>

  <line x1="60" y1="425" x2="440" y2="425" stroke="#E5A638" stroke-width="1" opacity="0.4" />
  <circle cx="250" cy="425" r="3" fill="#FFF5C2" filter="url(#fGlow)" />

  <text x="250" y="450" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="4" text-anchor="middle">SHIPPER MEET CARRIERS.</text>
</svg>
